# Local stack for the Customers & Orders orchestration saga.
# Mirrors ApplicationUnderTestUsingTestContainers, but with fixed ports.
#
#   1. Build the jars first (Java 17):  ./gradlew assemble   (see the study artifact)
#   2. docker compose up -d --build
#
# Host ports:
#   api-gateway 8083 | order-service 8081 | customer-service 8082 | cdc 8099
#   kafka 9092 | customer-service-db 3307 | order-service-db 3308

name: customers-and-orders

x-service-build-args: &service-build-args
  baseImageVersion: 0.3.0.RELEASE
  serviceImageVersion: 0.1.0-SNAPSHOT

x-mysql-env: &mysql-env
  MYSQL_DATABASE: eventuate
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_USER: mysqluser
  MYSQL_PASSWORD: mysqlpw

services:

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,BROKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,BROKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  customer-service-db:
    image: eventuateio/eventuate-vanilla-mysql8:0.22.0.RELEASE
    ports:
      - "3307:3306"
    environment: *mysql-env

  order-service-db:
    image: eventuateio/eventuate-vanilla-mysql8:0.22.0.RELEASE
    ports:
      - "3308:3306"
    environment: *mysql-env

  customer-service:
    build:
      context: ./customer-service/customer-service-main
      args: *service-build-args
    ports:
      - "8082:8080"
    depends_on:
      kafka: { condition: service_healthy }
      customer-service-db: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://customer-service-db:3306/eventuate
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: mysqlpw
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_DATABASE_SCHEMA: eventuate
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_TRACING_EXPORT_ENABLED: "false"

  order-service:
    build:
      context: ./order-service/order-service-main
      args: *service-build-args
    ports:
      - "8081:8080"
    depends_on:
      kafka: { condition: service_healthy }
      order-service-db: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://order-service-db:3306/eventuate
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: mysqlpw
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_DATABASE_SCHEMA: eventuate
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_TRACING_EXPORT_ENABLED: "false"

  api-gateway-service:
    build:
      context: ./api-gateway-service/api-gateway-service-main
      args: *service-build-args
    ports:
      - "8083:8080"
    depends_on:
      customer-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    environment:
      CUSTOMER_DESTINATIONS_CUSTOMERSERVICEURL: http://customer-service:8080
      ORDER_DESTINATIONS_ORDERSERVICEURL: http://order-service:8080
      APIGATEWAY_TIMEOUT_MILLIS: "1000"

  # Eventuate CDC: reads the MESSAGE outbox table of each DB (MySQL binlog)
  # and publishes the rows to Kafka. Starts after the services because their
  # Flyway migrations create the eventuate.message / cdc_monitoring tables.
  cdc-service:
    image: eventuateio/eventuate-cdc-service:0.20.0.RELEASE
    ports:
      - "8099:8080"
    depends_on:
      kafka: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: KafkaLeadership
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      EVENTUATE_CDC_READER_READER1_TYPE: mysql-binlog
      EVENTUATE_CDC_READER_READER1_DATASOURCEURL: jdbc:mysql://customer-service-db:3306/eventuate
      EVENTUATE_CDC_READER_READER1_DATASOURCEUSERNAME: root
      EVENTUATE_CDC_READER_READER1_DATASOURCEPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER1_DATASOURCEDRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_CDC_READER_READER1_CDCDBUSERNAME: root
      EVENTUATE_CDC_READER_READER1_CDCDBPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER1_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/customer-service-db
      EVENTUATE_CDC_READER_READER1_OUTBOXID: 1
      EVENTUATE_CDC_READER_READER1_MONITORINGSCHEMA: eventuate
      EVENTUATE_CDC_READER_READER1_OFFSETSTORAGETOPICNAME: db.history.common
      EVENTUATE_CDC_READER_READER1_READOLDDEBEZIUMDBOFFSETSTORAGETOPIC: "false"
      EVENTUATE_CDC_READER_READER1_MYSQLBINLOGCLIENTUNIQUEID: 1
      EVENTUATE_CDC_READER_READER1_OFFSETSTOREKEY: customer-service-db
      EVENTUATE_CDC_PIPELINE_PIPELINE1_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE1_READER: reader1
      EVENTUATE_CDC_PIPELINE_PIPELINE1_EVENTUATEDATABASESCHEMA: eventuate

      EVENTUATE_CDC_READER_READER2_TYPE: mysql-binlog
      EVENTUATE_CDC_READER_READER2_DATASOURCEURL: jdbc:mysql://order-service-db:3306/eventuate
      EVENTUATE_CDC_READER_READER2_DATASOURCEUSERNAME: root
      EVENTUATE_CDC_READER_READER2_DATASOURCEPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER2_DATASOURCEDRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      EVENTUATE_CDC_READER_READER2_CDCDBUSERNAME: root
      EVENTUATE_CDC_READER_READER2_CDCDBPASSWORD: rootpassword
      EVENTUATE_CDC_READER_READER2_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/order-service-db
      EVENTUATE_CDC_READER_READER2_OUTBOXID: 2
      EVENTUATE_CDC_READER_READER2_MONITORINGSCHEMA: eventuate
      EVENTUATE_CDC_READER_READER2_OFFSETSTORAGETOPICNAME: db.history.common
      EVENTUATE_CDC_READER_READER2_READOLDDEBEZIUMDBOFFSETSTORAGETOPIC: "false"
      EVENTUATE_CDC_READER_READER2_MYSQLBINLOGCLIENTUNIQUEID: 2
      EVENTUATE_CDC_READER_READER2_OFFSETSTOREKEY: order-service-db
      EVENTUATE_CDC_PIPELINE_PIPELINE2_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PIPELINE2_READER: reader2
      EVENTUATE_CDC_PIPELINE_PIPELINE2_EVENTUATEDATABASESCHEMA: eventuate
